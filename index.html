<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creyshel's Love Test 🌸</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: flex-end;
            padding-bottom: 80px;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            
            /* ==================================================== */
            background-image: url("background.jpg");
            /* ==================================================== */
            
            /* These settings ensure your photo looks perfect on all screens */
             background-size: contain;     /* To perfectly fit screen width */
             background-repeat: no-repeat;   /* Keeps it as one clean single picture */
             background-position: top center;/* Starts alignment perfectly at the top */
             background-color: #ffeef2;      /* A matching cute light pink background color for any extra space */
        }

       /* Styling the button so it floats fixed on the screen */
button {
    /* 1. This locks the button permanently on top of the screen */
    position: fixed;
    bottom: 50px;      /* Positions it exactly 80px from the bottom edge */
    left: 50%;         /* Places the button's starting point in the exact horizontal middle */
    transform: translateX(-50%); /* Perfectly re-centers the button so it sits perfectly centered */
    z-index: 10000;    /* Keeps the button on top of your background photo layers */

    padding: 18px 36px;
    font-size: 1.3rem;
    font-weight: bold;
    color: white;
    background-color: rgba(255, 77, 109, 0.85); /* Slightly see-through pink */
    border: 2px solid white;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    backdrop-filter: blur(5px); /* Gives the button a modern glass-like edge */
    transition: all 2s ease;
}

/* This keeps your hover zoom animation smooth with the new position settings */
button:hover {
    background-color: #ff758f;
    transform: translateX(-50%) translateY(-2px); /* Keeps it centered while bouncing up slightly */
    box-shadow: 0 12px 20px rgba(0,0,0,0.3);
}

/* ---------------------------------------------------- */
/* NEW MODAL CUSTOM DESIGN STYLES TO KEEP MUSIC PLAYING */
/* ---------------------------------------------------- */
.custom-modal {
    display: none; /* Keeps them hidden initially */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.95);
    padding: 25px 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    text-align: center;
    z-index: 20000;
    width: 300px;
    backdrop-filter: blur(10px);
    border: 2px solid #ff4d6d;
    font-family: Arial, sans-serif;
}

.custom-modal h3 {
    margin-top: 0;
    color: #ff4d6d;
    font-size: 1.3rem;
    line-height: 1.4;
}

.custom-modal input {
    width: 85%;
    padding: 12px;
    margin: 15px 0;
    border: 2px solid #ffccd5;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
    text-align: center;
}

.custom-modal input:focus {
    border-color: #ff4d6d;
}

/* Styling the tiny confirm keys inside the pop-up windows */
.modal-btn {
    position: static;
    transform: none;
    padding: 10px 25px;
    font-size: 1rem;
    border-radius: 12px;
    background-color: #ff4d6d;
    box-shadow: none;
}
.modal-btn:hover {
    background-color: #ff758f;
    transform: translateY(-1px);
}
</style>
</head>
<body>

    <!-- Main action button -->
    <button id="main-test-btn" onclick="startLoveTest()">what's the name of your so poging husband?? 🌸</button>
    
    <audio id="bg-music" src="music.mp3" loop></audio>

    <!-- STEP 1: The Non-blocking Question Popup -->
    <div id="prompt-modal" class="custom-modal">
        <h3>Who's the man? 🌸✨</h3>
        <input type="text" id="man-input-field" placeholder="Type name here...">
        <br>
        <button class="modal-btn" onclick="confirmNameSelection()">OK 💖</button>
    </div>

    <!-- STEP 2: The Non-blocking Final Love Announcement -->
    <div id="alert-modal" class="custom-modal">
        <h3 id="final-declaration-msg" style="color: #333; font-weight: normal;"></h3>
        <button class="modal-btn" onclick="closeEntireSequence()">Yay! 💑</button>
    </div>

    <script>
    // 1. Spawns custom input modal block without blocking the music line stream
    function startLoveTest() {
        document.getElementById('bg-music').play();
        document.getElementById('main-test-btn').style.display = 'none'; // Hides base button
        document.getElementById('prompt-modal').style.display = 'block'; // Shows custom question box
    }

    // 2. Evaluates the name entry dynamically
    function confirmNameSelection() {
        let name = document.getElementById('man-input-field').value.trim();
        
        if (!name) return; // Ignores empty spaces if clicked by mistake

        document.getElementById('prompt-modal').style.display = 'none'; // Closes input screen
        
        // Structures the final message strings safely
        document.getElementById('final-declaration-msg').innerHTML = "Hello, Creyshel! 💖 You are officially in love with <strong>" + name + "</strong>. 🌸💑❤️";
        document.getElementById('alert-modal').style.display = 'block'; // Triggers display window

        blastEmojis();
    }

    // 3. Wipes active layers clean so users can play again
    function closeEntireSequence() {
        document.getElementById('alert-modal').style.display = 'none';
        document.getElementById('main-test-btn').style.display = 'block';
        document.getElementById('man-input-field').value = ''; // Resets field values
    }

    function blastEmojis() {
        const emojis = ['❤️', '💖', '🌸', '💐', '💕', '🌹', '✨'];
        
        for (let i = 0; i < 40; i++) {
            let element = document.createElement('div');
            element.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            element.style.position = 'fixed';
            element.style.zIndex = '999999';
            element.style.fontSize = Math.floor(Math.random() * 24 + 20) + 'px';
            element.style.left = Math.random() * 100 + 'vw';
            element.style.bottom = '-50px';
            element.style.transition = 'transform 3s ease-out, opacity 3s ease-out';
            element.style.pointerEvents = 'none';
            
            document.body.appendChild(element);
            
            setTimeout(() => {
                let flyUp = Math.random() * -120 - 20;
                let drift = (Math.random() - 0.5) * 200;
                element.style.transform = `translate(${drift}px, ${flyUp}vh) rotate(${Math.random() * 360}deg)`;
                element.style.opacity = '0';
            }, 50);
            
            setTimeout(() => { element.remove(); }, 3000);
        }
    }
    </script>
</body>
</html>
